<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Annotation Workspace</title>
  <link rel="stylesheet" href="/ui/workspace.css">
  <script type="module" src="/ui/workspace.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">≋</span> Annotation Workspace</div>
      <a href="/docs">API docs</a>
    </div>
  </header>
  <main class="workspace">
    <form id="connect" class="connect">
      <div>
        <h1>Create a workspace</h1>
        <p>Use your API access token to upload files and ask questions.</p>
      </div>
      <div class="connect-fields">
        <label>Access token <input id="token" type="password" required autocomplete="off"></label>
        <button type="submit">Create workspace</button>
      </div>
      <p id="connect-status" class="notice" role="status"></p>
    </form>

    <div id="panels" class="panels" hidden>
      <section class="card files" aria-labelledby="files-title">
        <h2 id="files-title">Source files</h2>
        <label class="upload" id="drop" for="picker">
          <span class="upload-symbol" aria-hidden="true">+</span>
          <strong>Choose or drop files</strong>
          <span>Audio, video, documents, images</span>
          <input id="picker" type="file" multiple>
        </label>
        <p id="files-status" class="notice" role="status"></p>
        <ul id="files-list" class="files-list" aria-label="Uploaded files"></ul>
      </section>
      <section class="card chat" aria-labelledby="chat-title">
        <div class="chat-heading">
          <h2 id="chat-title">Ask your files</h2>
          <button type="button" id="reset" class="quiet" disabled>New conversation</button>
        </div>
        <p id="scope" class="scope">Searching all ready files</p>
        <div id="messages" class="messages" aria-live="polite">
          <p id="chat-empty" class="empty">Upload a file to get started. Select individual files to limit the sources for a question.</p>
        </div>
        <form id="ask">
          <label for="question">Your question</label>
          <textarea id="question" rows="3" maxlength="2000" required placeholder="What are the key findings?"></textarea>
          <div class="ask-footer">
            <p id="ask-status" class="notice" role="status"></p>
            <button type="submit" id="send" disabled>Ask question</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
